<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="نيكسورا">
<meta name="theme-color" content="#1F2A44">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>NEXORA OS</title>
<style>
:root{--navy:#1F2A44;--teal:#0F8B8D;--bg:#F3F6F8;--card:#fff;--line:#DCE4E8;--txt:#18212F;--mut:#6B7785;--red:#C0392B;--grn:#2E8B57;--amb:#D98E04}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Arabic","Geeza Pro","Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.5}
body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:5}
header .t{font-weight:800;font-size:20px;letter-spacing:.5px}
header .s{font-size:12px;opacity:.8}
main{padding:14px;max-width:720px;margin:0 auto}
h2{font-size:15px;color:var(--teal);margin:18px 2px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.title{font-weight:700}
.meta{font-size:12.5px;color:var(--mut);margin-top:2px}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:#E6EEF1;color:var(--navy);margin:4px 0 0 6px}
.chip.hi{background:#FBE3DF;color:var(--red)}.chip.ok{background:#DDF1E5;color:var(--grn)}.chip.warn{background:#FCEFCF;color:#8A5A00}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.kpi b{display:block;font-size:22px;color:var(--navy)}.kpi span{font-size:11.5px;color:var(--mut)}
.kpi.alert b{color:var(--red)}
button,.btn{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--teal);color:#fff;font-weight:700;min-height:44px}
button.sec{background:#E6EEF1;color:var(--navy)}button.dng{background:#FBE3DF;color:var(--red)}button.sm{min-height:36px;padding:6px 12px;font-size:14px}
.fab{position:fixed;left:16px;bottom:calc(90px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;font-size:30px;padding:0;box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:6}
nav{position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:7}
nav a{flex:1;text-align:center;padding:8px 2px 6px;color:var(--mut);text-decoration:none;font-size:11.5px}
nav a i{display:flex;justify-content:center;font-style:normal;margin-bottom:2px}
nav a.on{color:var(--teal);font-weight:700}
.empty{text-align:center;color:var(--mut);padding:26px 10px;border:1px dashed var(--line);border-radius:14px}
.note{font-size:12.5px;color:var(--mut);background:#EEF3F5;border-radius:10px;padding:8px 10px;margin:8px 0}
.sheet-bg{position:fixed;top:0;right:0;bottom:0;left:0;overflow:hidden;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--txt);direction:rtl}
input[type=date],input[type=number]{text-align:right}
.sheet .acts{position:sticky;bottom:-20px;background:#fff;padding:10px 0 6px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.menu a{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:8px;color:var(--txt);text-decoration:none;font-weight:700}
.menu a small{font-weight:400;color:var(--mut)}
.toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#18212F;color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;z-index:30}
.bar{height:8px;background:#E6EEF1;border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--teal)}
.sum{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<header><div class="t" id="ht">NEXORA OS</div><div class="s" id="hs">نظام تشغيلك الشخصي بالذكاء الاصطناعي</div></header>
<main id="app"></main>
<nav id="nav"></nav>
<script src="lessons.js"></script>
<script src="reports.js"></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(function(){});</script>
</body>
</html>
